apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-rail-config
data:
  BACKEND_MODE: "mock"
  QUEUE_CAPACITY: "256"
  MAX_BATCH_SIZE: "8"
  MAX_BATCH_WAIT_MS: "12"
